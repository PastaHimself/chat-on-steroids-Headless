name: Prepare Headless
description: Ubuntu 24.04 amd64, Node 24 and the sandboxed Electron/Brave runtime
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          discord/package-lock.json
    - name: Install display and native runtime libraries
      shell: bash
      run: |
        set -euo pipefail
        test "$(id -u)" -ne 0
        test "$(uname -m)" = x86_64
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 gnome-keyring libsecret-1-0 libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64
    - name: Install Brave from its official repository
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --proto '=https' --tlsv1.2 https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg -o "$RUNNER_TEMP/brave.gpg"
        sudo install -m 0644 "$RUNNER_TEMP/brave.gpg" /usr/share/keyrings/brave-browser-archive-keyring.gpg
        echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main' | sudo tee /etc/apt/sources.list.d/brave-browser-release.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends brave-browser
        /usr/bin/brave-browser --version
    - name: Install locked dependencies and verified native binaries
      shell: bash
      run: |
        npm ci --ignore-scripts
        npm run discord:install
        npm run headless:prepare
        sudo chown root:root node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
