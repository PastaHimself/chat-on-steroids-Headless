name: Headless candidate

# One validation/build authority for PRs, main, manual candidates and stable releases.
# Artifacts are source distributions: native dependencies are rebuilt on the VPS.
on:
  workflow_call:
    outputs:
      artifact-name:
        description: Verified source candidate from this exact run and attempt
        value: ${{ jobs.headless.outputs.artifact-name }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Ubuntu 24.04 amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COS_TEST_WORKERS: '2'
      COS_TEST_RETRY: '0'
    outputs:
      artifact-name: ${{ steps.candidate.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            discord/package-lock.json
      - name: Install Linux runtime and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Install locked dependencies and verified native runtime
        run: |
          npm ci --ignore-scripts
          npm run discord:install
          npm run headless:prepare
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify complete regression suite
        run: npm run verify:ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned plugin Python runtime
        run: python -m pip install uv==0.12.5
      - name: Exercise published plugins on Linux
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        run: npx vitest run --maxWorkers=1 test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts
      - name: Build and verify both applications with provenance
        run: |
          npm run headless:build
          npm run verify:headless-build
          node scripts/generate-discord-reference.mjs --check
      - name: Verify deployment boundaries and maintenance fault drills
        run: npm run verify:deployment
      - name: Exercise real windowless Electron and browser lifecycle
        run: |
          browser="$(command -v google-chrome)"
          test -x "$browser"
          COS_SMOKE_BROWSER="$browser" npm run verify:headless
          npm run verify:headless-build
      - name: Assemble verified source candidate
        id: candidate
        env:
          CANDIDATE_NAME: headless-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/headless-candidate.mjs create candidate "$(git rev-parse HEAD)"
          echo "name=$CANDIDATE_NAME" >> "$GITHUB_OUTPUT"
          {
            echo '### Headless source candidate'
            echo 'Ubuntu 24.04 amd64 / Node 24: regression suite, provenance build, deployment drills and isolated Electron/Xvfb/browser lifecycle passed.'
            echo 'Download the candidate artifact below. Build its commit on the VPS using docs/headless-vps.md before installation.'
            echo 'Authenticated provider/Discord delivery, privileged installation and long-running VPS acceptance remain separate live gates.'
            cat candidate/HEADLESS-BUILD.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Keep build evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/headless-build.json
            outputs/
          if-no-files-found: ignore
          retention-days: 7
