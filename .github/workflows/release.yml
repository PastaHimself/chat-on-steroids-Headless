name: Headless release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and smoke Ubuntu 24.04 x64 payload
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COS_TEST_WORKERS: '2'
      COS_TEST_RETRY: '1'
      COS_SMOKE_BROWSER: /usr/bin/brave-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw new Error('Tag/version mismatch')"
      - uses: ./.github/actions/setup-headless
      - name: Verify full Linux suite
        run: npm run verify:ci
      - name: Build the sealed backend and Discord payload
        run: |
          npm run headless:build
          npm run verify:headless-build
          node scripts/generate-discord-reference.mjs --check
      - name: Smoke deployment and real windowless lifecycle
        run: |
          npm run verify:deployment
          npm run verify:headless
      - name: Package corresponding native sources
        run: node scripts/package-native-sources.mjs
      - name: Package verified Headless bundle
        run: node scripts/package-headless.mjs
      - name: Verify the extracted candidate and checksums
        run: node scripts/verify-headless-release.mjs release "$GITHUB_SHA"
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-candidate-${{ github.run_id }}
          path: |
            release/Chat-On-Steroids-Headless-Linux-x64.tar.gz
            release/Chat-On-Steroids-Native-Sources.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
