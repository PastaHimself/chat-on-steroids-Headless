name: Headless test candidate (manual)

# Main pushes already receive a verified artifact through CI. This entry point is
# for an explicitly selected branch/tag; it never modifies a public release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    uses: ./.github/workflows/release.yml
