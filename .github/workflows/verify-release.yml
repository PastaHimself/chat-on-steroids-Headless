name: Verify published Headless release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        description: Immutable commit expected by the publishing run
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Headless release tag to verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: (github.event_name != 'release' || github.event.release.prerelease == false) && inputs.tag != 'canary'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify the release tag still names the published commit
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test -z "$EXPECTED_COMMIT" || test "$EXPECTED_COMMIT" = "$commit"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Download the published files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Verify headless checksums, source, native runtime and compiled payload
        run: node scripts/verify-headless-release.mjs assets "$RELEASE_COMMIT" "$TAG"
      - name: Open an issue when the release is not sound
        if: failure()
        run: |
          echo "Headless release $TAG failed download, identity or payload verification. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Release $TAG: published files failed verification" --body-file issue.md
