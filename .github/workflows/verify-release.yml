name: Verify published Headless release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Headless version tag to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Headless version tag to verify, for example v2.1.34
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    # Legacy desktop releases and prereleases have a different artifact contract.
    if: github.repository == 'PastaHimself/chat-on-steroids-Headless' && (github.event_name != 'release' || (github.event.release.prerelease == false && (contains(github.event.release.assets.*.name, 'HEADLESS-BUILD.json') || contains(github.event.release.assets.*.name, 'Chat-On-Steroids-Headless-Source.tar.gz') || contains(github.event.release.assets.*.name, 'Chat-On-Steroids-Headless-Extension.zip'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require a version tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install checker dependencies
        run: npm ci --ignore-scripts
      - name: Download the published files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Verify published source, extension, metadata and exact checksums
        run: node scripts/headless-candidate.mjs verify assets "$(git rev-parse HEAD)" "$TAG"
      - name: Report failed verification
        if: failure()
        run: |
          printf 'Headless release %s failed artifact verification. Inspect the [workflow run](%s/%s/actions/runs/%s).\n' \
            "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Headless release $TAG: verification failed" --body-file issue.md
