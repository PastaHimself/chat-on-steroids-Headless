name: Headless CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ubuntu 24.04 x64 / Node 24 / Discord
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COS_TEST_WORKERS: '2'
      COS_TEST_RETRY: '1'
      COS_SMOKE_BROWSER: /usr/bin/brave-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-headless
      - name: Verify full Linux suite and both packages
        run: npm run verify:ci
      - name: Build and verify committed Headless payload
        run: |
          npm run headless:build
          npm run verify:headless-build
          node scripts/generate-discord-reference.mjs --check
      - name: Verify deployment and real Electron/Xvfb/Brave lifecycle
        run: |
          npm run verify:deployment
          npm run verify:headless
      - name: Keep build identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-build-identity-${{ github.run_id }}
          path: runtime/headless-build.json
          if-no-files-found: error
          retention-days: 7

  plugins:
    name: Published npm and Python plugins on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install plugin test dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install uv==0.12.5
      - name: Exercise published plugins without competing installs
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        run: npx vitest run --maxWorkers=1 test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts
